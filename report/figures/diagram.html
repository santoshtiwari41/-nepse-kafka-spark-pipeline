<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; background: #ffffff; font-family: "Helvetica Neue", Arial, sans-serif; }
  text { font-family: "Helvetica Neue", Arial, sans-serif; }
  .title { font-size: 15px; font-weight: 700; fill: #0b0b0b; }
  .sub { font-size: 12px; fill: #52514e; }
  .item { font-size: 12.5px; fill: #1f1f1d; }
  .lane { font-size: 13px; font-weight: 700; fill: #898781; letter-spacing: 1px; }
  .lbl { font-size: 11.5px; fill: #52514e; }
  .box { fill: #f7f7f5; stroke: #c3c2b7; stroke-width: 1.5; }
  .kafka { fill: #fdeee7; stroke: #eb6834; stroke-width: 1.8; }
  .spark { fill: #e9f1fc; stroke: #2a78d6; stroke-width: 1.8; }
  .hdfs  { fill: #e6f6ef; stroke: #1baf7a; stroke-width: 1.8; }
  .inner { fill: #ffffff; stroke: #c3c2b7; stroke-width: 1.2; }
  .pill-k { fill: #ffffff; stroke: #eb6834; stroke-width: 1.2; }
  .pill-h { fill: #ffffff; stroke: #1baf7a; stroke-width: 1.2; }
  .arrow { stroke: #52514e; stroke-width: 1.8; fill: none; marker-end: url(#ah); }
  .dash { stroke: #898781; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; marker-end: url(#ahg); }
</style></head>
<body>
<svg id="d" xmlns="http://www.w3.org/2000/svg" width="1700" height="860" viewBox="0 0 1700 860">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker>
  </defs>
  <rect width="1700" height="860" fill="#ffffff"/>

  <!-- lanes -->
  <text class="lane" x="30" y="40">SPEED LAYER (REAL-TIME)</text>
  <line x1="30" y1="425" x2="1680" y2="425" stroke="#e1e0d9" stroke-width="1.5"/>
  <text class="lane" x="30" y="460">BATCH LAYER (HISTORICAL)</text>

  <!-- column headers -->
  <text class="lbl" x="145" y="75" text-anchor="middle">DATA SOURCES</text>
  <text class="lbl" x="415" y="75" text-anchor="middle">INGESTION</text>
  <text class="lbl" x="700" y="75" text-anchor="middle">MESSAGING</text>
  <text class="lbl" x="1040" y="75" text-anchor="middle">PROCESSING</text>
  <text class="lbl" x="1355" y="75" text-anchor="middle">STORAGE / SERVING</text>
  <text class="lbl" x="1600" y="75" text-anchor="middle">VISUALISATION</text>

  <!-- A: sources -->
  <rect class="box" x="30" y="100" width="230" height="74" rx="8"/>
  <text class="title" x="45" y="128">NEPSE official API</text>
  <text class="sub" x="45" y="148">live prices · market status</text>
  <text class="sub" x="45" y="165">649 companies + sectors</text>

  <rect class="box" x="30" y="192" width="230" height="58" rx="8"/>
  <text class="title" x="45" y="218">ShareSansar live page</text>
  <text class="sub" x="45" y="238">fallback live source</text>

  <rect class="box" x="30" y="268" width="230" height="58" rx="8"/>
  <text class="title" x="45" y="294">Recorded sessions</text>
  <text class="sub" x="45" y="314">data/recordings/*.jsonl</text>

  <rect class="box" x="30" y="500" width="230" height="110" rx="8"/>
  <text class="title" x="45" y="528">Historical price data</text>
  <text class="sub" x="45" y="548">GitHub nepse-data: 372 companies,</text>
  <text class="sub" x="45" y="565">daily OHLCV + turnover (CSV)</text>
  <text class="sub" x="45" y="582">MeroLagani: NEPSE index</text>
  <text class="sub" x="45" y="599">since 2000 (JSON → CSV)</text>

  <!-- B: producers -->
  <rect class="box" x="310" y="118" width="210" height="74" rx="8"/>
  <text class="title" x="325" y="146">Live producer</text>
  <text class="sub" x="325" y="166">Python · polls every 5 s</text>
  <text class="sub" x="325" y="183">sends only changed ticks</text>

  <rect class="box" x="310" y="262" width="210" height="92" rx="8"/>
  <text class="title" x="325" y="290">Replay producer</text>
  <text class="sub" x="325" y="310">Python · any past day at 60×</text>
  <text class="sub" x="325" y="327">recording or simulated from</text>
  <text class="sub" x="325" y="344">daily OHLCV (same tick schema)</text>

  <!-- C: Kafka ingest -->
  <rect class="kafka" x="580" y="100" width="240" height="250" rx="10"/>
  <text class="title" x="600" y="128">Apache Kafka (KRaft)</text>
  <text class="sub" x="600" y="148">distributed commit log · 7-day retention</text>
  <rect class="pill-k" x="600" y="172" width="200" height="74" rx="6"/>
  <text class="item" x="614" y="196" font-weight="700">topic nepse.ticks</text>
  <text class="sub" x="614" y="215">3 partitions · key = symbol</text>
  <text class="sub" x="614" y="232">JSON tick messages</text>
  <text class="sub" x="600" y="280">• buffers bursts</text>
  <text class="sub" x="600" y="298">• decouples producers / Spark</text>
  <text class="sub" x="600" y="316">• replayable (offsets)</text>

  <!-- D: Spark -->
  <rect class="spark" x="880" y="100" width="320" height="720" rx="10"/>
  <text class="title" x="900" y="128">Apache Spark 3.5 (standalone cluster)</text>
  <rect class="inner" x="900" y="148" width="280" height="232" rx="8"/>
  <text class="title" x="915" y="174">Structured Streaming</text>
  <text class="item" x="915" y="198">• parse JSON, event-time watermark</text>
  <text class="item" x="915" y="220">• 1-min OHLC candles + VWAP</text>
  <text class="item" x="915" y="242">• sector money flow per minute</text>
  <text class="item" x="915" y="264">• live state per symbol (stateful)</text>
  <text class="item" x="915" y="286">• alerts: circuit, volume spike,</text>
  <text class="item" x="928" y="306">big move</text>
  <text class="item" x="915" y="328">• stream-static join (sector, volume)</text>
  <text class="item" x="915" y="350">• checkpoints → exactly-once</text>

  <rect class="inner" x="900" y="490" width="280" height="310" rx="8"/>
  <text class="title" x="915" y="516">Batch jobs (Spark SQL, MLlib)</text>
  <text class="item" x="915" y="542">• load CSV → bronze</text>
  <text class="item" x="915" y="564">• clean: invalid rows, OHLC repair,</text>
  <text class="item" x="928" y="584">dedupe, bonus-share adjustment</text>
  <text class="item" x="915" y="606">• indicators: SMA 20/50/200, RSI,</text>
  <text class="item" x="928" y="626">Bollinger, volatility, 52-week H/L</text>
  <text class="item" x="915" y="648">• sector &amp; market aggregates</text>
  <text class="item" x="915" y="670">• volume baseline for alerts</text>
  <text class="item" x="915" y="692">• analytical Spark SQL queries</text>
  <text class="item" x="915" y="714">• MLlib random forest (next-day</text>
  <text class="item" x="928" y="734">up/down), time-based split</text>
  <text class="sub" x="915" y="772">window functions over 514 k rows</text>

  <!-- E1: Kafka serving -->
  <rect class="kafka" x="1240" y="100" width="230" height="150" rx="10"/>
  <text class="title" x="1258" y="128">Kafka output topics</text>
  <rect class="pill-k" x="1258" y="142" width="194" height="46" rx="6"/>
  <text class="item" x="1270" y="162" font-weight="700">nepse.analytics</text>
  <text class="sub" x="1270" y="179">latest state · log-compacted</text>
  <rect class="pill-k" x="1258" y="194" width="194" height="46" rx="6"/>
  <text class="item" x="1270" y="214" font-weight="700">nepse.alerts</text>
  <text class="sub" x="1270" y="231">circuit · spike · big move</text>

  <!-- E2: HDFS -->
  <rect class="hdfs" x="1240" y="300" width="230" height="520" rx="10"/>
  <text class="title" x="1258" y="328">HDFS data lake</text>
  <text class="sub" x="1258" y="348">Parquet · NameNode + DataNode</text>
  <rect class="pill-h" x="1258" y="366" width="194" height="90" rx="6"/>
  <text class="item" x="1270" y="388" font-weight="700">bronze/  (raw)</text>
  <text class="sub" x="1270" y="407">prices, index, companies</text>
  <text class="sub" x="1270" y="424">+ lineage columns</text>
  <text class="sub" x="1270" y="441">streamed ticks (by date)</text>
  <rect class="pill-h" x="1258" y="470" width="194" height="74" rx="6"/>
  <text class="item" x="1270" y="492" font-weight="700">silver/  (clean)</text>
  <text class="sub" x="1270" y="511">validated, adjusted prices</text>
  <text class="sub" x="1270" y="528">partitioned by year</text>
  <rect class="pill-h" x="1258" y="558" width="194" height="160" rx="6"/>
  <text class="item" x="1270" y="580" font-weight="700">gold/  (analytics)</text>
  <text class="sub" x="1270" y="599">indicators, latest snapshot</text>
  <text class="sub" x="1270" y="616">sector &amp; market daily</text>
  <text class="sub" x="1270" y="633">volume baseline</text>
  <text class="sub" x="1270" y="650">1-min candles, sector flow</text>
  <text class="sub" x="1270" y="667">alerts history</text>
  <text class="sub" x="1270" y="684">ML metrics + predictions</text>
  <text class="sub" x="1270" y="701">data-quality report</text>
  <rect class="pill-h" x="1258" y="732" width="194" height="70" rx="6"/>
  <text class="item" x="1270" y="754" font-weight="700">checkpoints/</text>
  <text class="sub" x="1270" y="773">Kafka offsets + streaming</text>
  <text class="sub" x="1270" y="790">state (fault tolerance)</text>

  <!-- F: dashboard -->
  <rect class="box" x="1520" y="230" width="160" height="200" rx="8"/>
  <text class="title" x="1535" y="258">Streamlit</text>
  <text class="title" x="1535" y="276">dashboard</text>
  <text class="sub" x="1535" y="300">LIVE / REPLAY /</text>
  <text class="sub" x="1535" y="316">HISTORICAL badge</text>
  <text class="sub" x="1535" y="340">• Live market</text>
  <text class="sub" x="1535" y="357">• Stock explorer</text>
  <text class="sub" x="1535" y="374">• Market &amp; sectors</text>
  <text class="sub" x="1535" y="391">• Screener</text>
  <text class="sub" x="1535" y="408">• Pipeline</text>

  <!-- arrows: sources → producers -->
  <path class="arrow" d="M260,137 L308,150"/>
  <path class="arrow" d="M260,221 L308,175"/>
  <path class="arrow" d="M260,297 L308,302"/>
  <path class="arrow" d="M260,525 C340,525 380,440 400,356"/>
  <text class="lbl" x="402" y="420">simulate ticks</text>
  <text class="lbl" x="402" y="436">from daily OHLCV</text>
  <!-- producers → kafka -->
  <path class="arrow" d="M520,160 L598,200"/>
  <path class="arrow" d="M520,300 L598,225"/>
  <text class="lbl" x="528" y="152">LIVE</text>
  <text class="lbl" x="526" y="322">REPLAY</text>
  <!-- kafka → streaming -->
  <path class="arrow" d="M800,209 L898,209"/>
  <text class="lbl" x="828" y="200">subscribe</text>
  <!-- streaming → kafka out -->
  <path class="arrow" d="M1180,175 L1256,165"/>
  <path class="arrow" d="M1180,215 L1256,217"/>
  <!-- streaming → hdfs -->
  <path class="arrow" d="M1180,320 C1215,320 1220,400 1256,410"/>
  <!-- hdfs gold → streaming (reference) -->
  <path class="dash" d="M1256,598 H1222 V420 H1100 V384"/>
  <text class="lbl" x="905" y="414">reference data from gold:</text>
  <text class="lbl" x="905" y="430">sector + normal volume per stock</text>
  <text class="lbl" x="905" y="446">(stream-static join)</text>
  <!-- history → batch -->
  <path class="arrow" d="M260,555 L898,555"/>
  <text class="lbl" x="520" y="545">bulk load (Spark CSV reader)</text>
  <!-- batch ↔ hdfs -->
  <path class="arrow" d="M1180,520 L1256,505"/>
  <text class="lbl" x="1186" y="503">write</text>
  <path class="arrow" d="M1256,640 L1182,640"/>
  <text class="lbl" x="1188" y="657">read</text>
  <path class="arrow" d="M1180,690 L1256,690"/>
  <!-- outputs → dashboard -->
  <path class="arrow" d="M1470,175 C1500,175 1500,250 1518,262"/>
  <text class="lbl" x="1478" y="286">consume</text>
  <path class="arrow" d="M1470,560 C1510,560 1520,480 1560,432"/>
  <text class="lbl" x="1476" y="588">WebHDFS</text>

  <!-- legend -->
  <line x1="30" y1="790" x2="70" y2="790" stroke="#52514e" stroke-width="1.8" marker-end="url(#ah)"/>
  <text class="lbl" x="80" y="794">data flow</text>
  <line x1="170" y1="790" x2="210" y2="790" stroke="#898781" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ahg)"/>
  <text class="lbl" x="220" y="794">reference lookup</text>
  <rect x="350" y="780" width="16" height="16" class="kafka"/><text class="lbl" x="372" y="794">Kafka</text>
  <rect x="430" y="780" width="16" height="16" class="spark"/><text class="lbl" x="452" y="794">Spark</text>
  <rect x="510" y="780" width="16" height="16" class="hdfs"/><text class="lbl" x="532" y="794">HDFS</text>
  <text class="lbl" x="30" y="830">All services run as Docker containers (docker-compose): Kafka, Kafka UI, HDFS NameNode + DataNode, Spark master + worker, dashboard.</text>
</svg>
</body></html>
